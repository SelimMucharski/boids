<text x="544" y="88" fill="#e6edf3" font-size="15" font-family="ui-monospace, monospace">build()  — O(n), every step</text>
<text x="544" y="114" fill="#7d8590" font-size="13" font-family="ui-monospace, monospace">1. bounding box of all boids → grid size</text>
<text x="544" y="140" fill="#7d8590" font-size="13" font-family="ui-monospace, monospace">2. count boids per cell</text>
<text x="544" y="166" fill="#7d8590" font-size="13" font-family="ui-monospace, monospace">3. prefix sum → cellStart[]</text>
<text x="544" y="192" fill="#7d8590" font-size="13" font-family="ui-monospace, monospace">4. scatter indices → sorted[]</text>
<text x="544" y="244" fill="#e6edf3" font-size="15" font-family="ui-monospace, monospace">forEachCandidate(p)</text>
<text x="544" y="270" fill="#7d8590" font-size="13" font-family="ui-monospace, monospace">scan 9 contiguous ranges of sorted[]</text>
<text x="544" y="296" fill="#7d8590" font-size="13" font-family="ui-monospace, monospace">no allocations, cache-friendly</text>
<use href="#b" fill="#f78166" transform="translate(46,336) scale(1.3)"/><text x="60" y="340" fill="#7d8590" font-size="13">current boid</text>
<use href="#b" fill="#e6edf3" transform="translate(206,336) scale(1.3)"/><text x="220" y="340" fill="#7d8590" font-size="13">neighbour (d &lt; FAR)</text>
<use href="#b" fill="#7d8590" transform="translate(406,336) scale(1.3)"/><text x="420" y="340" fill="#7d8590" font-size="13">candidate, rejected by distance</text>
<use href="#b" fill="#30363d" transform="translate(676,336) scale(1.3)"/><text x="690" y="340" fill="#7d8590" font-size="13">never visited</text>
